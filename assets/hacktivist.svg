<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" font-family="'Fira Code','JetBrains Mono',ui-monospace,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0F17"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#0D1117" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1200" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- scanning grid -->
    <g stroke="#1F2A3A" stroke-width="1">
      <line x1="0" y1="60" x2="1200" y2="60"/>
      <line x1="0" y1="120" x2="1200" y2="120"/>
      <line x1="0" y1="180" x2="1200" y2="180"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
    </g>

    <!-- digital rain -->
    <g font-size="15" fill="#22D3EE" opacity="0.55">
      <g transform="translate(40,0)">
        <text>
          <tspan x="0" dy="0">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan>
          <animateTransform attributeName="transform" type="translate" from="0 -340" to="0 340" dur="6s" repeatCount="indefinite"/>
        </text>
      </g>
      <g transform="translate(95,0)">
        <text>
          <tspan x="0" dy="0">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan>
          <animateTransform attributeName="transform" type="translate" from="0 -420" to="0 340" dur="8.5s" repeatCount="indefinite"/>
        </text>
      </g>
      <g transform="translate(150,0)">
        <text>
          <tspan x="0" dy="0">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan>
          <animateTransform attributeName="transform" type="translate" from="0 -300" to="0 340" dur="5.2s" repeatCount="indefinite"/>
        </text>
      </g>
      <g transform="translate(1010,0)">
        <text>
          <tspan x="0" dy="0">0</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan>
          <animateTransform attributeName="transform" type="translate" from="0 -360" to="0 340" dur="7s" repeatCount="indefinite"/>
        </text>
      </g>
      <g transform="translate(1065,0)">
        <text>
          <tspan x="0" dy="0">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan>
          <animateTransform attributeName="transform" type="translate" from="0 -480" to="0 340" dur="9.5s" repeatCount="indefinite"/>
        </text>
      </g>
      <g transform="translate(1120,0)">
        <text>
          <tspan x="0" dy="0">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">1</tspan><tspan x="0" dy="20">0</tspan><tspan x="0" dy="20">0</tspan>
          <animateTransform attributeName="transform" type="translate" from="0 -320" to="0 340" dur="6.3s" repeatCount="indefinite"/>
        </text>
      </g>
    </g>
    <rect width="1200" height="300" fill="url(#fade)"/>

    <!-- terminal window -->
    <g transform="translate(315,44)">
      <rect width="570" height="212" rx="10" fill="#0A0E16" stroke="#1F2A3A" stroke-width="1.5"/>
      <rect width="570" height="34" rx="10" fill="#111A27"/>
      <rect y="24" width="570" height="10" fill="#111A27"/>
      <circle cx="20" cy="17" r="5" fill="#FF5F56"/>
      <circle cx="40" cy="17" r="5" fill="#FFBD2E"/>
      <circle cx="60" cy="17" r="5" fill="#27C93F"/>
      <text x="285" y="21" text-anchor="middle" font-size="12" fill="#5B6B82">node://mohammad-omar — secure shell</text>

      <g font-size="13.5" filter="url(#glow)">
        <text x="24" y="68" fill="#22D3EE">
          <tspan fill="#4ADE80">visitor@github</tspan>:~$ ./handshake --node mainframe
          <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="0.3s" fill="freeze"/>
        </text>
        <text x="24" y="96" fill="#94A3B8" opacity="0">
          [ ok ]  authenticating identity ......... verified
          <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="1.1s" fill="freeze"/>
        </text>
        <text x="24" y="124" fill="#94A3B8" opacity="0">
          [ ok ]  linking iot • cloud • security ... online
          <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="1.9s" fill="freeze"/>
        </text>
        <text x="24" y="152" fill="#94A3B8" opacity="0">
          [ ok ]  compiling firmware payload ....... done
          <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="2.7s" fill="freeze"/>
        </text>
        <text x="24" y="182" fill="#4ADE80" opacity="0" font-weight="bold">
          &gt;&gt; ACCESS GRANTED — welcome to the build.
          <animate attributeName="opacity" from="0" to="1" dur="0.05s" begin="3.6s" fill="freeze"/>
        </text>
        <rect x="24" y="171" width="9" height="15" fill="#4ADE80">
          <animate attributeName="opacity" values="1;1;0;0" dur="1s" begin="3.6s" repeatCount="indefinite"/>
          <animate attributeName="x" to="352" dur="0.05s" begin="3.6s" fill="freeze"/>
        </rect>
      </g>
    </g>

    <!-- glitch headline -->
    <g font-size="15" font-weight="bold" letter-spacing="3">
      <text x="315" y="34" fill="#F43F5E" opacity="0.85">
        MOHAMMAD OMAR
        <animate attributeName="opacity" values="0.85;0.2;0.9;0.6;0.85" dur="3s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="translate" values="0 0; -2 0; 2 0; 0 0" dur="0.25s" begin="2s;5s;8s" additive="sum"/>
      </text>
      <text x="315" y="34" fill="#22D3EE" opacity="0.55">
        MOHAMMAD OMAR
        <animateTransform attributeName="transform" type="translate" values="0 0; 2 0; -2 0; 0 0" dur="0.25s" begin="2s;5s;8s"/>
      </text>
    </g>
    <text x="884" y="34" text-anchor="end" font-size="12" letter-spacing="2" fill="#5B6B82">// SYSTEM ONLINE</text>

    <rect x="0" y="0" width="1200" height="300" rx="14" fill="none" stroke="#22D3EE" stroke-opacity="0.25" stroke-width="2"/>
  </g>
</svg>
